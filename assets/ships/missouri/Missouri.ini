
[core]

name: Missouri
price: 1600
maxHp: 1500
armour: 20
tags: battleship, shiptarget
weapon:mark7 406mm custom image_turret, auto control, tomahawk block 4 *1, harpoon block 3*1. rim 162*4, auto control,

[graphics]
total_frames: 1

image:        Missouri_Body.png
image_wreak:  NONE
image_turret: NONE


image_shadow: AUTO
shadowOffsetX:4
shadowOffsetY:4


movementEffect: CUSTOM:splashFront, CUSTOM:splashBack
movementEffectRate: 3

[effect_splashFront]
image: ROOT:Data/front.png
createWhenOverLand: false
life: 60
fadeOut: true
atmospheric: false
spawnChance: 0.64
attachedToUnit: false
fadeInTime:10
scaleFrom: 1.5
scaleTo: 2
alpha: 0.4
drawUnderUnits:true
yOffsetRelative: 0
xOffsetRelative: 0
xOffsetRelativeRandom: 1
ySpeedRelative: -0.1

[effect_splashBack]
image: ROOT:data/back.png
createWhenOverLand: false
life: 180
fadeOut: true
atmospheric: false
spawnChance: 0.64
attachedToUnit: false
fadeInTime:10
scaleFrom: 1
scaleTo: 1.1
alpha: 0.3
drawUnderUnits:true
yOffsetRelative: 0
xOffsetRelative: 0
ySpeedRelative: -0.1

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackshipUnits:   true


turretSize: 32
turretTurnSpeed: 1.8

turretMultiTargeting: true

[turret_1]
x: 1
y: 30

shoot_sound: ROOT:Data/sfx/sfx_cannon.wav
shoot_sound_vol: 10
shoot_flame: CUSTOM:battleshipShot
projectile: 1
image: Cannon1.png
limitingAngle: 90

[turret_2]
x: 1
y: 13
copyFrom: 1
image: Cannon2.png

[turret_3]
x: -1
y: -40
copyFrom: 1
image: Cannon3.png
idleDir: 180

[effect_battleshipShot]
life: 70
showInFog: true
scaleFrom: 1
scaleTo: 1
attachedToUnit: false
image: ROOT:Data/muzzle_battleship.png
total_frames: 10
animateFrameStart: 0
animateFrameEnd: 9
animateFrameSpeed: 0.24
fadeOut: false
yOffsetRelative: 0
