attachedToUnit: false
fadeInTime:10
scaleFrom: 1.3
scaleTo: 1.4
alpha: 0.3
drawUnderUnits:true
yOffsetRelative: -10
ySpeedRelative: -0.1

[effect_splashBack]
image: ROOT:Data/back.png
createWhenOverLand: false
life: 120
fadeOut: true
atmospheric: false
spawnChance: 0.64
attachedToUnit: false
fadeInTime:10
scaleFrom: 0.6
scaleTo: 0.8
alpha: 0.3
drawUnderUnits:true
yOffsetRelative: -40
ySpeedRelative: -0.1

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackshipUnits:   true

turretSize: 21

[turret_1]
#autocannon
x: 0
y: 45
turnSpeed: 3.0
turnSpeedAcceleration: 1.0

shoot_sound: ROOT:Data/sfx/sfx_cannon.wav
shoot_sound_vol:5
