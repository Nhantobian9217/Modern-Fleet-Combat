
[core]
name: Ticonderoga
price: 1200
maxHp: 720
armour: 10

tags: shiptarget

weapon,2 mark 45 mod 4 (custom image_turret), tomahawk block 4*2, nsm*1, auto control, rim 162*2, rim 116*2.

[graphics]

total_frames: 1

image:        Ticonderoga_Body.png 
